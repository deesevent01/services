<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deesevent</title>
  <meta name="description" content="Site officiel Deesevent">
  <meta name="theme-color" content="#25D366">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      text-align: center;
    }
    h1 { color: #25D366; }

    /* Bouton WhatsApp Flottant */
    .whatsapp-float {
      position: fixed;
      width: 60px;
      height: 60px;
      bottom: 20px;
      right: 20px;
      background-color: #25D366;
      color: #FFF;
      border-radius: 50px;
      text-align: center;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.3);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      text-decoration: none;
    }
    .whatsapp-float:hover {
      transform: scale(1.1);
      background-color: #20BA5A;
    }
    .whatsapp-float img {
      width: 35px;
      height: 35px;
    }
  </style>
</head>
<body>

  <h1>Bienvenue sur Deesevent</h1>
  <p>Ceci est ton site transformé en application 📱</p>

  <!-- Bouton WhatsApp Flottant -->
  <!-- CHANGE 223XXXXXXXXX par ton numéro -->
  <a href="https://wa.me/223XXXXXXXXX?text=Bonjour%20je%20viens%20de%20votre%20site%20Deesevent" 
     class="whatsapp-float" 
     target="_blank">
    <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png" alt="WhatsApp">
  </a>

  <script>
    // Enregistrer le Service Worker pour PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>
</body>
</html>
